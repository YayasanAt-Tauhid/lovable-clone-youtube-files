name = "lovable-clone"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".open-next/assets"

# ──────────────────────────────────────────────
# Environment variables (public — NEXT_PUBLIC_*)
# Set secret vars (CLERK_SECRET_KEY, etc.) in the
# Cloudflare Pages dashboard → Settings → Variables
# ──────────────────────────────────────────────
[vars]
NEXT_PUBLIC_CLERK_SIGN_IN_URL = "/sign-in"
NEXT_PUBLIC_CLERK_SIGN_UP_URL = "/sign-up"
NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL = "/dashboard"
NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL = "/dashboard"

# ──────────────────────────────────────────────
# Preview environment (wrangler pages dev)
# ──────────────────────────────────────────────
[env.preview.vars]
NEXT_PUBLIC_WORKER_URL = "http://localhost:8787"

# ──────────────────────────────────────────────
# Production environment
# Override NEXT_PUBLIC_WORKER_URL after you deploy the worker
# ──────────────────────────────────────────────
[env.production.vars]
NEXT_PUBLIC_WORKER_URL = "https://lovable-clone-worker.YOURNAME.workers.dev"
